# Replay (test-only) of already-trained XPE and SPT adapters on bebe.
# Skips the tune phase entirely — the adapter_uuid4 + adapter_path fields
# tell run_xlt_meta to register the path under the uuid in env vars and let
# the toolkit's resolver pick it up at test time. No tune_configs section
# because no entry has `tune_method`.
#
# These two adapters came out of the failed 3_full_aya run (SLURM job
# 2955994) — both tunes completed; only the bebe test phase OOMed before
# raw.csv could be written. Now that:
#   - test configs set PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
#   - micm_nlp/training/batching.py _HEADROOM lowered to 0.80
# the test phase should fit on A100-80GB.
#
# Dispatch (interactive single entry first to confirm):
#   python -m scripts.run_xlt_meta \
#       --meta-config ./config/meta/4_replay_aya.yml \
#       --test-config ./config/test.lm.aya.ds.bebe.yml \
#       --source-langs en,ru,zh,es,ar,hi,id \
#       --target-langs kat_Geor,eng_Latn \
#       --task-id 0
#
# Source-langs is optional in replay mode (used only for run-dir naming);
# pass it to keep the existing src_tag convention.

matrix:

