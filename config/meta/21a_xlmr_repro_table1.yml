  - {tune_method: d30, run_name: d30leg_s19, seed: 19, overrides: {peft.encoder_ratio: 0.3, custom_training_args.optimizer_grouped_parameters.0.lr: 5e-5, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.01, custom_training_args.optimizer_grouped_parameters.1.lr: 5e-3, custom_training_args.optimizer_grouped_parameters.1.weight_decay: 0.0}}
  - {tune_method: d30, run_name: d30leg_s20, seed: 20, overrides: {peft.encoder_ratio: 0.3, custom_training_args.optimizer_grouped_parameters.0.lr: 5e-5, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.01, custom_training_args.optimizer_grouped_parameters.1.lr: 5e-3, custom_training_args.optimizer_grouped_parameters.1.weight_decay: 0.0}}

  # ===== d70_leg (idx 60-69) =====
  - {tune_method: d70, run_name: d70leg_s11, seed: 11, overrides: {peft.encoder_ratio: 0.7, custom_training_args.optimizer_grouped_parameters.0.lr: 5e-5, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.01, custom_training_args.optimizer_grouped_parameters.1.lr: 5e-3, custom_training_args.optimizer_grouped_parameters.1.weight_decay: 0.0}}
  - {tune_method: d70, run_name: d70leg_s12, seed: 12, overrides: {peft.encoder_ratio: 0.7, custom_training_args.optimizer_grouped_parameters.0.lr: 5e-5, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.01, custom_training_args.optimizer_grouped_parameters.1.lr: 5e-3, custom_training_args.optimizer_grouped_parameters.1.weight_decay: 0.0}}
  - {tune_method: d70, run_name: d70leg_s13, seed: 13, overrides: {peft.encoder_ratio: 0.7, custom_training_args.optimizer_grouped_parameters.0.lr: 5e-5, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.01, custom_training_args.optimizer_grouped_parameters.1.lr: 5e-3, custom_training_args.optimizer_grouped_parameters.1.weight_decay: 0.0}}
