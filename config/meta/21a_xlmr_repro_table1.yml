  - {tune_method: d30, run_name: d30leg_s11, seed: 11, overrides: {peft.encoder_ratio: 0.3, custom_training_args.optimizer_grouped_parameters.0.lr: 5e-5, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.01, custom_training_args.optimizer_grouped_parameters.1.lr: 5e-3, custom_training_args.optimizer_grouped_parameters.1.weight_decay: 0.0}}
