  - {tune_method: xpe, run_name: xpe_plr2e-3_s13, seed: 13, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-3, training_args.args.learning_rate: 5.0e-4, training_args.args.max_steps: 32000}}
  - {tune_method: xpe, run_name: xpe_plr5e-3_s11, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-3, training_args.args.learning_rate: 5.0e-4, training_args.args.max_steps: 32000}}
