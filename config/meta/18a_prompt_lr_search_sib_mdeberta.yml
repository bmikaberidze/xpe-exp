  - {tune_method: xpe, run_name: xpe_wd0_plr2e-3_s11, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-3, custom_training_args.optimizer_grouped_parameters.0.weight_decay: 0.0, training_args.args.learning_rate: 5.0e-4, training_args.args.max_steps: 32000}}
