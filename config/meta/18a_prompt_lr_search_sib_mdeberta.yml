  - {tune_method: xpe, run_name: xpe_plr1e-1_s11, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-1, training_args.args.learning_rate: 5.0e-4, training_args.args.max_steps: 32000}}
