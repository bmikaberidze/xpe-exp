# EVAL-ONLY: the PUBLISHED Table 1 adapters, scored through OUR pipeline.
#
# NO TRAINING. Every entry carries adapter_uuid4 + adapter_path, which run_xlt
# treats as skip-tune-and-test. The weights are the actual artefacts that produced
# xpe.pdf Table 1 (group5_nlp storage), converted to our schema by
# artefacts/_scratch/convert_published_adapters.py -- the only change is the key
# rename `prompt_encoder.embedding` -> `prompt_encoder.xpe_embedding` for XPE,
# which the 2025-11-10 `cross_prompt_encoder.py` rename made necessary.
#
# THE QUESTION. Weight forensics showed our arm-A adapters are statistically
# indistinguishable from the published ones (prompt_std 0.9970 vs 0.9974,
# head_std 0.0296 identical) -- yet the paper reports ~1.2 pts higher on joshi5
# low-perf. Identical weights cannot score differently, so the gap must be in
# CHECKPOINT SELECTION or EVALUATION, not training dynamics.
#
# READING IT (compare against xpe.pdf Table 1 for the same method+source):
#   published adapters score ~= paper  -> our EVAL is faithful; the gap is ours in
#       training/selection, and the prime suspect is our declared deviation of
#       stopping on accuracy where the published runs stopped on eval_loss.
#   published adapters score ~= OUR arm A -> our eval differs from theirs; the
#       models are the same and the published numbers came from a different
#       evaluation. Then an eval_loss re-run would be chasing the wrong thing.
#
# Only SPT and XPE exist (published task 1 = XPE, task 4 = SPT); DUAL source
# models were never saved. Sources: joshi5 and xlmr_seen only.
#
# Dispatch ONE source group at a time:
#   sbatch --array=0-19%10 --mem=64G \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m scripts.run_xlt_meta \
#           --meta-config ./config/meta/21c_published_adapter_eval.yml \
#           --test-config ./config/test.lm.xlmr.ds.sib.yml \
#           --source-group joshi5"        # then xlmr_seen with --array=20-39%10

