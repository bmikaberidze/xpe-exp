# LR sensitivity search on aya-8b: XPE × {5e-6, 5e-5, 5e-4} + SPT × {5e-4, 5e-3, 5e-2}.
# Symmetric factor-of-10 spacing around the paper anchors (5e-5 for XPE, 5e-3 for SPT).
# All 6 entries use the same tune-config-as-base; only training_args.args.learning_rate
# is overridden per entry. Selection metric is eval_loss (LossEarlyStoppingCallback
# watches it; metric_for_best_model=accuracy still loads the best-accuracy checkpoint
# at end, so the saved adapter is the strongest one within the eval_loss-driven horizon).
#
# Dispatch (single entry first to confirm):
#   python -m scripts.run_xlt_meta \
#       --meta-config ./config/meta/5_lr_search_aya.yml \
#       --test-config ./config/test.lm.aya.ds.bebe.yml \
#       --source-langs en,ru,zh,es,ar,hi,id \
#       --target-langs kat_Geor,eng_Latn \
#       --task-id 0
#
# Full array:
#   sbatch --array=0-5 runtime/clusters/pegasus/shell/run.sh --site-packages \
#     "python -m scripts.run_xlt_meta \
#         --meta-config ./config/meta/5_lr_search_aya.yml \
#         --test-config ./config/test.lm.aya.ds.bebe.yml \
#         --source-langs en,ru,zh,es,ar,hi,id \
#         --target-langs kat_Geor,eng_Latn"

tune_configs:
  xpe: ./config/tune.xpe.lm.aya.ds.xsc.yml
  spt: ./config/tune.spt.lm.aya.ds.xsc.yml

matrix:

  # 0: XPE lr=5e-6 (one OOM below paper anchor)
  - tune_method: xpe
    run_name: xpe_lr5e6
    overrides:
      training_args.args.learning_rate: 5.0e-6

  # 1: XPE lr=5e-5 (paper anchor)
  - tune_method: xpe
    run_name: xpe_lr5e5
    overrides:
      training_args.args.learning_rate: 5.0e-5

  # 2: XPE lr=5e-4 (one OOM above paper anchor)
  - tune_method: xpe
    run_name: xpe_lr5e4
    overrides:
      training_args.args.learning_rate: 5.0e-4

  # 3: SPT lr=5e-4 (one OOM below paper anchor)
  - tune_method: spt
    run_name: spt_lr5e4
    overrides:
      training_args.args.learning_rate: 5.0e-4

  # 4: SPT lr=5e-3 (paper anchor)
  - tune_method: spt
    run_name: spt_lr5e3
    overrides:
      training_args.args.learning_rate: 5.0e-3

  # 5: SPT lr=5e-2 (one OOM above paper anchor)
  - tune_method: spt
    run_name: spt_lr5e2
    overrides:
      training_args.args.learning_rate: 5.0e-2
