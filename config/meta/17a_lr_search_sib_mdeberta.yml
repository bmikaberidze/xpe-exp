# PHASE A of the SIB-200 LR search on mDeBERTa-v3-base: the single XPE learning rate.
# 18 cells = 6 LRs x 3 seeds, XPE only.
#
# REVISED 2026-08-07. The previous 36-cell version of this file swept
# custom_training_args.optimizer_grouped_parameters[0].lr -- which reaches ONLY
# `xpe_embedding`, i.e. 15,360 of 1,071,367 trainable parameters (1.4%). The
# other 98.6% -- the xpe_head MLP, the pooler and the classifier, all randomly
# initialised -- sat at a fixed 5e-5 in every cell. Those runs are discarded;
# nothing references them.
#
# WHAT IS SWEPT NOW. XPE has ONE learning rate covering everything it trains,
# per xpe.pdf sec. 4.4: "For XPE, we use a learning rate of 5e-5 and weight decay
# of 0.1 for BOTH the prompt encoder and the classification head." One rate
# governs prompt embeddings + xpe_head + pooler + classifier together. (The
# legacy CODE carved xpe_embedding out at 5e-3; the paper never mentions that,
# and it is what made the previous sweep vacuous.)
#
# REPLAY NOTE 2026-08-08 (behaviour-preserving, results unchanged): these ran with
# NO param group, so xpe_embedding moved at each cell's lr. Phase B added a group to
# the tune config, so each cell now also sets group.0.lr to that same lr.
#
# WHY XPE FIRST, SPT SECOND. The classification head is shared by both methods
# and the paper fixes it to the same value for both ("the classification head
# remains under the same settings as in XPE"). So the XPE LR is a joint quantity:
# search it here, then Phase B searches only SPT's soft-prompt LR with the head
# pinned to this winner. Because the head LR is shared, tuning it cannot bias the
# XPE-vs-SPT comparison.
#
# GRID. Legacy 5e-5 sits at position 2, with four points above it: the head is
# ~600k randomly-initialised parameters on a base-size backbone (vs XLM-R-large's
# 1.06M inside a 560M model), and its slowness is the leading suspect for
# mdeberta/seen still climbing at epoch 12.
#
# Selection on VALIDATION ACCURACY. --skip-test: no per-language test phase.
# No folds: SIB-200 ships official 701/99/204 splits.
#
# !! mDeBERTa CANNOT RUN ON B200 -- DeBERTa-v2 jit.scripts build_relative_position
# and this container's NVRTC does not know Blackwell (sm_100). The DEFAULT
# partition includes B200, so the pin below is REQUIRED.
# Dispatch:
#   sbatch --array=0-17%10 --mem=64G \
#     --partition=H100,H100-PCI,H100-Trails,H200,H200-PCI,A100-80GB \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m scripts.run_xlt_meta \
#           --meta-config ./config/meta/17a_lr_search_sib_mdeberta.yml \
#           --test-config ./config/test.lm.mdeberta.ds.sib.yml \
#           --source-group mdeberta_seen --skip-test"
#
# Pick: python -m scripts.evals.unify_xlt_valid_res <dir> --group-by learning_rate

tune_configs:
  xpe: ./config/tune.xpe.lm.mdeberta.ds.sib.yml

matrix:

  # ===== xpe x lr x seed  (idx 0-17) =====
  - {tune_method: xpe, run_name: xpe_lr2e-5_s11, seed: 11, overrides: {training_args.args.learning_rate: 2.0e-5, custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-5}}
  - {tune_method: xpe, run_name: xpe_lr2e-5_s12, seed: 12, overrides: {training_args.args.learning_rate: 2.0e-5, custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-5}}
  - {tune_method: xpe, run_name: xpe_lr2e-5_s13, seed: 13, overrides: {training_args.args.learning_rate: 2.0e-5, custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-5}}
  - {tune_method: xpe, run_name: xpe_lr5e-5_s11, seed: 11, overrides: {training_args.args.learning_rate: 5.0e-5, custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-5}}
  - {tune_method: xpe, run_name: xpe_lr5e-5_s12, seed: 12, overrides: {training_args.args.learning_rate: 5.0e-5, custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-5}}
  - {tune_method: xpe, run_name: xpe_lr5e-5_s13, seed: 13, overrides: {training_args.args.learning_rate: 5.0e-5, custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-5}}
  - {tune_method: xpe, run_name: xpe_lr1e-4_s11, seed: 11, overrides: {training_args.args.learning_rate: 1.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr1e-4_s12, seed: 12, overrides: {training_args.args.learning_rate: 1.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr1e-4_s13, seed: 13, overrides: {training_args.args.learning_rate: 1.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr2e-4_s11, seed: 11, overrides: {training_args.args.learning_rate: 2.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr2e-4_s12, seed: 12, overrides: {training_args.args.learning_rate: 2.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr2e-4_s13, seed: 13, overrides: {training_args.args.learning_rate: 2.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 2.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr5e-4_s11, seed: 11, overrides: {training_args.args.learning_rate: 5.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr5e-4_s12, seed: 12, overrides: {training_args.args.learning_rate: 5.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr5e-4_s13, seed: 13, overrides: {training_args.args.learning_rate: 5.0e-4, custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-4}}
  - {tune_method: xpe, run_name: xpe_lr1e-3_s11, seed: 11, overrides: {training_args.args.learning_rate: 1.0e-3, custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-3}}
  - {tune_method: xpe, run_name: xpe_lr1e-3_s12, seed: 12, overrides: {training_args.args.learning_rate: 1.0e-3, custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-3}}
  - {tune_method: xpe, run_name: xpe_lr1e-3_s13, seed: 13, overrides: {training_args.args.learning_rate: 1.0e-3, custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-3}}
