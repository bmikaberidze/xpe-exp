# FULL SIB-200 zero-shot XLT grid, gte-multilingual-mlm-base -- twin of 19a.
# 20 cells = 4 methods x 5 seeds. Seeds 16-20 get APPENDED later as idx 20-39.
# NO fold axis (SIB-200 ships official 701/99/204 splits).
#   method = xpe (ratio 1), spt (ratio 0), d30 (0.3), d70 (0.7)
#   seed   = 11..15 for now. The paper reports 10 zero-shot seeds (p.6) and at n=5 its
#            ~2.8-pt effects are NOT separable, so 5 is a first pass, not the final n.
#            EXTEND ADDITIVELY: append seeds 16-20 as indices 20-39 in the same method
#            order, with a dated comment -- never renumber or edit an existing row.
# SOURCE GROUP is a CLI axis, dispatched one array at a time (never a loop over runs):
#   enarzho (3) | joshi5 (7) | mgte_seen (76)
#   => 60 runs per backbone at n=5; 120 once seeds 16-20 land.
#
# HYPERPARAMETERS ARE MEASURED, NOT INHERITED -- see docs/paper-notes.md sec. 1 + 6:
#   head/global lr  5e-4   (Phase A 17b; 10x the paper's 5e-5, +2.0 pts -- and mDeBERTa
#                   picked the SAME value independently)
#   xpe prompt lr   = global, i.e. NO carve-out (Phase B 18a/18b: no transferable gain,
#                     and the two backbones trended OPPOSITE ways -> paper's single LR)
#   spt prompt lr   5e-2 / wd 0  (Phase B: +2.2 pts over a shared lr; 100x the head,
#                     preserving the legacy ratio; plateau 2e-2..1e-1)
#   dual            per side: SPT half 5e-2/wd0, XPE half = global
#   max_steps       24000 (Adafactor, cosine w/ restarts) -- unchanged; at 5e-4 mGTE
#                   peaks BEFORE the wall in 3/3 seeds. Patience 20.
# All of the above live in the tune configs; this file overrides only encoder_ratio.
#
# Selection on VALIDATION accuracy; test phase RUNS (no --skip-test) -> per-language
# zero-shot XLT accuracies for every target language.
#
# mGTE's pretraining languages are nearly a SUBSET of XLM-R's: only ceb_Latn,
# hat_Latn, quy_Latn, tgl_Latn, yor_Latn are seen here and unseen for XLM-R, while 21
# XLM-R languages are unseen here -- so mgte_unseen strictly EXTENDS the paper's Unseen
# group. NB LANG_GROUPS['mgte_seen'] holds 76 codes; the plan's prose says 75 pretraining
# languages -- the two have not been reconciled, so do not quote 75 in the write-up.
#
# Base-size backbone, so absolute accuracies sit below the published
# XLM-R-large table; the XPE-vs-SPT contrast is within-backbone and unaffected.
#
# mGTE loads Hub-hosted code (config.json auto_map -> Alibaba-NLP/new-impl). Revisions
# pinned in the tune configs for reproducibility:
#   Alibaba-NLP/gte-multilingual-mlm-base @ b747c5e8eb09e48c24eb3d4e48f80a79a18889ff
#   Alibaba-NLP/new-impl                  @ 40ced75c3017eb27626c9d4ea981bde21a2662f4
#
# Same non-B200 pin as 19a: mDeBERTa provably cannot run on sm_100, and whether mGTE's
# custom NewModel can is untested.
# Dispatch ONE group at a time, each confirmed landed before the next:
#   sbatch --array=0-19%10 --mem=64G \
#     --partition=H100,H100-PCI,H100-Trails,H200,H200-PCI,A100-80GB \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m scripts.run_xlt_meta \
#           --meta-config ./config/meta/19b_sib_grid_mgte.yml \
#           --test-config ./config/test.lm.mgte.ds.sib.yml \
#           --source-group enarzho"        # then joshi5, then mgte_seen
#
# Aggregate: unify_xlt_test_res.py per group dir, then aggregate_xlt_res.py.

tune_configs:
  xpe: ./config/tune.xpe.lm.mgte.ds.sib.yml
  spt: ./config/tune.spt.lm.mgte.ds.sib.yml
  d30: ./config/tune.dual.lm.mgte.ds.sib.yml
  d70: ./config/tune.dual.lm.mgte.ds.sib.yml

matrix:

  # ===== xpe (encoder_ratio 1) x seed{11..15}  (idx 0-4) =====
  - {tune_method: xpe, run_name: xpe_s11, seed: 11}
  - {tune_method: xpe, run_name: xpe_s12, seed: 12}
  - {tune_method: xpe, run_name: xpe_s13, seed: 13}
  - {tune_method: xpe, run_name: xpe_s14, seed: 14}
  - {tune_method: xpe, run_name: xpe_s15, seed: 15}

  # ===== spt (encoder_ratio 0) x seed{11..15}  (idx 5-9) =====
  - {tune_method: spt, run_name: spt_s11, seed: 11}
  - {tune_method: spt, run_name: spt_s12, seed: 12}
  - {tune_method: spt, run_name: spt_s13, seed: 13}
  - {tune_method: spt, run_name: spt_s14, seed: 14}
  - {tune_method: spt, run_name: spt_s15, seed: 15}

  # ===== d30 (encoder_ratio 0.3) x seed{11..15}  (idx 10-14) =====
  - {tune_method: d30, run_name: d30_s11, seed: 11, overrides: {peft.encoder_ratio: 0.3}}
  - {tune_method: d30, run_name: d30_s12, seed: 12, overrides: {peft.encoder_ratio: 0.3}}
  - {tune_method: d30, run_name: d30_s13, seed: 13, overrides: {peft.encoder_ratio: 0.3}}
  - {tune_method: d30, run_name: d30_s14, seed: 14, overrides: {peft.encoder_ratio: 0.3}}
  - {tune_method: d30, run_name: d30_s15, seed: 15, overrides: {peft.encoder_ratio: 0.3}}

  # ===== d70 (encoder_ratio 0.7) x seed{11..15}  (idx 15-19) =====
  - {tune_method: d70, run_name: d70_s11, seed: 11, overrides: {peft.encoder_ratio: 0.7}}
  - {tune_method: d70, run_name: d70_s12, seed: 12, overrides: {peft.encoder_ratio: 0.7}}
  - {tune_method: d70, run_name: d70_s13, seed: 13, overrides: {peft.encoder_ratio: 0.7}}
  - {tune_method: d70, run_name: d70_s14, seed: 14, overrides: {peft.encoder_ratio: 0.7}}
  - {tune_method: d70, run_name: d70_s15, seed: 15, overrides: {peft.encoder_ratio: 0.7}}
