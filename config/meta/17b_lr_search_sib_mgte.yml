# LR search for SIB-200 on gte-multilingual-mlm-base (36 cells: method x prompt-lr x seed).
#   method    = xpe, spt                          [2]  DUAL inherits the winner.
#   prompt lr = 1e-3, 2e-3, 5e-3, 1e-2, 2e-2, 5e-2 [6]  ~half-decade steps,
#                                                       centred on the legacy 5e-3
#   seed      = 11, 12, 13                        [3]
#
# REVISED 2026-08-06 BEFORE ANY SURVIVING DISPATCH. The earlier 8-cell version of
# this file was only ever used for two timing probes of one cell, both deleted in
# 077917f, so no results referenced it. Per the "metaconfigs are immutable
# contracts" rule in CLAUDE.md, once cells here produce results this file is
# frozen -- additions only, never edits.
#
# WHY 3 SEEDS. A single seed cannot resolve this. Two runs of the identical cell
# (xpe @ 5e-3, seed 11, mgte_seen) gave val 0.7667 and 0.8005 -- 3.4 points apart
# from kernel nondeterminism alone (full_determinism: false), against method
# effects of ~2.8 points in the published paper. A 1-seed pick would be noise.
# 3 seeds is still coarse; treat the winner as "this region is fine", not as a
# tuned optimum, and let the 10-seed grid do the statistical work.
#
# WHICH LR THIS SWEEPS. The published recipe has TWO learning rates
# (xpe.pdf sec. 4.4 + nlpka xpe_utils.py:289-300):
#   prompt embeddings          lr 5e-3, wd 0.0   <- custom_training_args
#                                                   .optimizer_grouped_parameters[0]
#   encoder MLP + classifier   lr 5e-5, wd 0.01  <- training_args.args
# This sweeps the PROMPT-side one, the parameter actually being learned. Sweeping
# training_args.args.learning_rate instead would, for SPT, vary only the
# classification head while the soft prompt stayed pinned -- a meaningless sweep.
# The backbone side is held at the legacy 5e-5.
#
# WHY SWEEP AT ALL. 5e-3 was tuned for XLM-R-LARGE (1024-dim, 560M); both new
# backbones are base-size (768-dim). The 4000-step smoke already reached val
# 0.848 at the legacy value, so this is a confirmation sweep -- its job is to
# catch a genuine failure (e.g. divergence at 5e-2) rather than to find an optimum.
#
# Selection is on VALIDATION ACCURACY, never eval loss (eval-loss explosion is
# cosmetic under prompt tuning -- 15a probe). --skip-test: selection reads
# valid_res.csv, so the per-language test phase would be wasted work.
#
# No folds: SIB-200 ships official 701/99/204 splits, so `fold` is empty in
# valid_res.csv -- unify_xlt_valid_res handles that since 6ad388c.
#
# max_steps stays at the config's 24000 (the legacy XLM-R budget). On mgte_seen
# that is 1665 steps/epoch = 14.4 epochs, and early stopping can never fire
# (50% gate at epoch 7, ~7 left vs patience 20). Measured cost of one cell:
# ~18 min. At %10 that is 4 waves, ~1h15 for all 36.
#
# Partition is pinned to the same non-B200 set as 17a. mDeBERTa provably cannot
# run on B200 (NVRTC arch error); whether mGTE's custom NewModel has the same
# problem is UNTESTED, so the safe default is the same pin.
# Dispatch:
#   sbatch --array=0-35%10 --mem=64G \
#     --partition=H100,H100-PCI,H100-Trails,H200,H200-PCI,A100-80GB \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m scripts.run_xlt_meta \
#           --meta-config ./config/meta/17b_lr_search_sib_mgte.yml \
#           --test-config ./config/test.lm.mgte.ds.sib.yml \
#           --source-group mgte_seen --skip-test"
#
# Pick: python -m scripts.evals.unify_xlt_valid_res <run-group dir>

tune_configs:
  xpe: ./config/tune.xpe.lm.mgte.ds.sib.yml
  spt: ./config/tune.spt.lm.mgte.ds.sib.yml

