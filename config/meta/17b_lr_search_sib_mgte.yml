# LR search for SIB-200 on gte-multilingual-mlm-base (8 cells: method x prompt-lr).
#   method    = xpe, spt      [2]  -- DUAL inherits the winner; sweeping it would
#                                    triple the cost for no extra signal.
#   prompt lr = 1e-3, 5e-3, 1e-2, 5e-2                                       [4]
#   seed      = 11 (single seed; a coarse pick, not a replication study)
#
# WHICH LR THIS SWEEPS. The published recipe has TWO learning rates
# (xpe.pdf sec. 4.4 + nlpka xpe_utils.py:289-300):
#   prompt embeddings          lr 5e-3, wd 0.0   <- custom_training_args
#                                                   .optimizer_grouped_parameters[0]
#   encoder MLP + classifier   lr 5e-5, wd 0.01  <- training_args.args
# This sweeps the PROMPT-side one, because that is the parameter actually being
# learned. Sweeping training_args.args.learning_rate instead would, for SPT,
# vary only the classification head while the soft prompt stayed pinned -- a
# meaningless sweep. The backbone side is held at the legacy 5e-5.
#
# WHY SWEEP AT ALL. 5e-3 was tuned for XLM-R-LARGE (1024-dim, 560M). Both new
# backbones are base-size (768-dim), so the prompt-side optimum need not carry
# over. Note the 4000-step smoke already reached val 0.848 at the legacy value,
# so this is a confirmation sweep, not a rescue.
#
# Selection is on VALIDATION ACCURACY (metric_for_best_model=accuracy), never
# eval loss -- eval-loss explosion is cosmetic under prompt tuning (15a probe).
#
# --skip-test: selection reads valid_res.csv, so the per-language test phase is
# wasted work here. run_xlt raises if --skip-test is passed without a tune phase.
#
# No folds: SIB-200 ships official train/validation/test splits (701/99/204), so
# `fold` is empty in valid_res.csv -- unify_xlt_valid_res handles that since
# commit 6ad388c.
#
# max_steps stays at the config's 24000, which is the legacy XLM-R budget. It
# buys very different epoch counts per source group (2015 steps/epoch on
# mgte_seen = 11.9 epochs; 153 on joshi5 = 157 epochs), and on mgte_seen
# early stopping can never fire: the 50% gate lands at epoch 6 with ~6 epochs
# left against patience 20. That asymmetry held identically in the published
# XLM-R runs, so it is faithful, not a defect.
#
# Partition is pinned to the same non-B200 set as 17a. mDeBERTa provably cannot
# run on B200 (NVRTC arch error from its jit.script'd build_relative_position);
# whether mGTE's custom NewModel has the same problem is UNTESTED, so the safe
# default is the same pin.
#
# Dispatch (throttled %10; one source group at a time, confirm each landed):
#   sbatch --array=0-7%10 --mem=64G \
#     --partition=H100,H100-PCI,H100-Trails,H200,H200-PCI,A100-80GB \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m scripts.run_xlt_meta \
#           --meta-config ./config/meta/17b_lr_search_sib_mgte.yml \
#           --test-config ./config/test.lm.mgte.ds.sib.yml \
#           --source-group mgte_seen --skip-test"
#
# Pick: python -m scripts.evals.unify_xlt_valid_res <run-group dir>

tune_configs:
  xpe: ./config/tune.xpe.lm.mgte.ds.sib.yml
  spt: ./config/tune.spt.lm.mgte.ds.sib.yml

matrix:

  # ===== xpe x prompt-lr  (idx 0-3) =====
  - {tune_method: xpe, run_name: xpe_plr1e-3, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-3}}
  - {tune_method: xpe, run_name: xpe_plr5e-3, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-3}}
  - {tune_method: xpe, run_name: xpe_plr1e-2, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-2}}
  - {tune_method: xpe, run_name: xpe_plr5e-2, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-2}}

  # ===== spt x prompt-lr  (idx 4-7) =====
  - {tune_method: spt, run_name: spt_plr1e-3, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-3}}
  - {tune_method: spt, run_name: spt_plr5e-3, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-3}}
  - {tune_method: spt, run_name: spt_plr1e-2, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 1.0e-2}}
  - {tune_method: spt, run_name: spt_plr5e-2, seed: 11, overrides: {custom_training_args.optimizer_grouped_parameters.0.lr: 5.0e-2}}
