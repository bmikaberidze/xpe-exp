# 26b_bebe_grid_aya, source group JOSHI5 (aya).
#
# Purpose: micm-nlp 0.5 era bridge. Same units + seed 10 as the pre-0.4 run of
# 14a_bebe_grid_full_aya.joshi5, so per-run accuracies can be compared across eras
# before the aya_high numbers (26a) are read against old-era rows.
#
# Generated: scripts/gen_xlt_group_config.sh 26b_bebe_grid_aya joshi5 aya ../units "10"
# One group config per source group: one experiment, one output directory
# (artefacts/runs/groups/26b_bebe_grid_aya.joshi5/), so a group's runs can never mix two
# source sets. Every entry key beyond the reserved ones is stamped on each result
# row, so method / fold / source_group / llm are columns of the aggregate table.
#
# Axes: method (xpe, spt, d30, d70) x fold (0,1,2) x seed (10) = 12 runs.
# The DUAL arms differ from each other only by peft.encoder_ratio.
#
# Dispatch (Aya needs >80 GB VRAM -> pin the big-VRAM partitions; --mem is host RAM):
#   sbatch --array=0-11%10 --mem=80G \
#     --partition=B200,H200,H200-PCI,H100-PCI \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m micm_nlp run-group \
#          --group-config config/groups/26b_bebe_grid_aya.joshi5.yml \
#          --runner scripts.xlt_runner:run \
#          --root-path /fscratch/bmikaberidze/xpe-exp"

configs:
  xpe:  ../units/tune.xpe.lm.aya.ds.bebe.yml
  spt:  ../units/tune.spt.lm.aya.ds.bebe.yml
  dual: ../units/tune.dual.lm.aya.ds.bebe.yml
  test: ../units/test.lm.aya.ds.bebe.fold.yml

runs:

  # ===== xpe =====
  - {config: xpe,  name: xpe_f0_s10, seed: 10, fold: 0, method: xpe, source_group: joshi5, llm: aya, separate_test: {config: test}}
  - {config: xpe,  name: xpe_f1_s10, seed: 10, fold: 1, method: xpe, source_group: joshi5, llm: aya, separate_test: {config: test}}
  - {config: xpe,  name: xpe_f2_s10, seed: 10, fold: 2, method: xpe, source_group: joshi5, llm: aya, separate_test: {config: test}}

  # ===== spt =====
  - {config: spt,  name: spt_f0_s10, seed: 10, fold: 0, method: spt, source_group: joshi5, llm: aya, separate_test: {config: test}}
  - {config: spt,  name: spt_f1_s10, seed: 10, fold: 1, method: spt, source_group: joshi5, llm: aya, separate_test: {config: test}}
  - {config: spt,  name: spt_f2_s10, seed: 10, fold: 2, method: spt, source_group: joshi5, llm: aya, separate_test: {config: test}}

  # ===== d30 =====
  - {config: dual, name: d30_f0_s10, seed: 10, fold: 0, method: d30, source_group: joshi5, llm: aya, overrides: {peft.encoder_ratio: 0.3}, separate_test: {config: test}}
  - {config: dual, name: d30_f1_s10, seed: 10, fold: 1, method: d30, source_group: joshi5, llm: aya, overrides: {peft.encoder_ratio: 0.3}, separate_test: {config: test}}
  - {config: dual, name: d30_f2_s10, seed: 10, fold: 2, method: d30, source_group: joshi5, llm: aya, overrides: {peft.encoder_ratio: 0.3}, separate_test: {config: test}}

  # ===== d70 =====
  - {config: dual, name: d70_f0_s10, seed: 10, fold: 0, method: d70, source_group: joshi5, llm: aya, overrides: {peft.encoder_ratio: 0.7}, separate_test: {config: test}}
  - {config: dual, name: d70_f1_s10, seed: 10, fold: 1, method: d70, source_group: joshi5, llm: aya, overrides: {peft.encoder_ratio: 0.7}, separate_test: {config: test}}
  - {config: dual, name: d70_f2_s10, seed: 10, fold: 2, method: d70, source_group: joshi5, llm: aya, overrides: {peft.encoder_ratio: 0.7}, separate_test: {config: test}}
