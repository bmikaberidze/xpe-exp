  - {config: spt, name: spt_lr5e3_s10_f0, seed: 10, fold: 0, method: spt, source_group: gemma_high, llm: g4, overrides: {training_args.args.learning_rate: 0.005, training_args.args.max_steps: 4000}, tune_only: true}
  - {config: spt, name: spt_lr5e3_s11_f0, seed: 11, fold: 0, method: spt, source_group: gemma_high, llm: g4, overrides: {training_args.args.learning_rate: 0.005, training_args.args.max_steps: 4000}, tune_only: true}
