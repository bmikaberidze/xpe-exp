  - {config: xpe, name: xpe_lr1e3_s12_f0, seed: 12, fold: 0, method: xpe, source_group: gemma_high, llm: g4, overrides: {training_args.args.learning_rate: 0.001, training_args.args.max_steps: 4000}, tune_only: true}
