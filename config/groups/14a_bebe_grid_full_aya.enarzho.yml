# Belebele self-split grid, Aya-Expanse-8b, source group ENARZHO.
#
# The 0.4 rebuild of config/meta/14a_bebe_grid_full_aya.yml, whose runs live under
# artefacts/evals/xlt_runs/aya/enarzho/14a_bebe_grid_full_aya/ and were produced by
# the pre-micm-nlp-0.4 tree. One group config per source group: joshi5 and aya_seen
# are their own files, so a group's runs can never mix two source sets.
#
# Axes: method (xpe, spt, d30, d70) x fold (0,1,2) x seed (10..19) = 120 runs.
# Every entry key beyond the reserved ones is stamped on each result row, so
# method / fold / source_group are columns of the aggregate table.
#
# LRs come from the unit configs (XPE 5e-4; SPT-part 0.5 after the stability re-pick).
# The DUAL arms differ from each other only by peft.encoder_ratio.
#
# Aya needs >80 GB VRAM -> the sbatch MUST pin the big-VRAM partitions.
#
# Dispatch:
#   sbatch --array=0-119%10 --mem=64G \
#     --partition=B200,H200,H200-PCI,H100-PCI,H100-Trails \
#     runtime/clusters/pegasus/shell/run.sh --site-packages \
#       "python -m micm_nlp run-group \
#          --group-config config/groups/14a_bebe_grid_full_aya.enarzho.yml \
#          --runner scripts/xlt_runner.py \
#          --root-path /fscratch/bmikaberidze/xpe-exp"

configs:
  xpe:  ../units/tune.xpe.lm.aya.ds.bebe.yml
  spt:  ../units/tune.spt.lm.aya.ds.bebe.yml
  dual: ../units/tune.dual.lm.aya.ds.bebe.yml
